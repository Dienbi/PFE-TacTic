name: Build and Push Images

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_OWNER: ${{ toLower(github.repository_owner) }}

jobs:
  build-and-push:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/tactic-backend:sha-${{ steps.vars.outputs.SHORT_SHA }}
            ghcr.io/${{ env.IMAGE_OWNER }}/tactic-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend/Dockerfile
          build-args: |
            REACT_APP_API_URL=/api
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/tactic-frontend:sha-${{ steps.vars.outputs.SHORT_SHA }}
            ghcr.io/${{ env.IMAGE_OWNER }}/tactic-frontend:latest

      - name: Build and push ai-service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/ai-service/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/tactic-ai-service:sha-${{ steps.vars.outputs.SHORT_SHA }}
            ghcr.io/${{ env.IMAGE_OWNER }}/tactic-ai-service:latest
