name: TacTic CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend - PHPUnit
    runs-on: self-hosted

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: tactic_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify baked runner tools
        run: |
          php -v
          composer --version
          pg_isready --version

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare Laravel test environment
        run: |
          cp .env.example .env
          php artisan key:generate
          cp .env .env.testing

          sed -i 's/^APP_ENV=.*/APP_ENV=testing/' .env.testing || echo "APP_ENV=testing" >> .env.testing
          sed -i 's/^CACHE_DRIVER=.*/CACHE_DRIVER=file/' .env.testing || echo "CACHE_DRIVER=file" >> .env.testing
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=pgsql/' .env.testing || echo "DB_CONNECTION=pgsql" >> .env.testing
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env.testing || echo "DB_HOST=127.0.0.1" >> .env.testing
          sed -i 's/^DB_PORT=.*/DB_PORT=${{ job.services.postgres.ports[5432] }}/' .env.testing || echo "DB_PORT=${{ job.services.postgres.ports[5432] }}" >> .env.testing
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=tactic_db/' .env.testing || echo "DB_DATABASE=tactic_db" >> .env.testing
          sed -i 's/^DB_USERNAME=.*/DB_USERNAME=postgres/' .env.testing || echo "DB_USERNAME=postgres" >> .env.testing
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=admin/' .env.testing || echo "DB_PASSWORD=admin" >> .env.testing

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            pg_isready -h 127.0.0.1 -p "${{ job.services.postgres.ports[5432] }}" -U postgres && exit 0
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          exit 1

      - name: Run database migrations
        run: php artisan migrate --env=testing --force
        env:
          APP_ENV: testing
          CACHE_DRIVER: file
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ job.services.postgres.ports[5432] }}
          DB_DATABASE: tactic_db
          DB_USERNAME: postgres
          DB_PASSWORD: admin

      - name: Run PHPUnit
        run: php artisan test --env=testing
        env:
          APP_ENV: testing
          CACHE_DRIVER: file
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ job.services.postgres.ports[5432] }}
          DB_DATABASE: tactic_db
          DB_USERNAME: postgres
          DB_PASSWORD: admin

  frontend-tests:
    name: Frontend - TypeScript and Build
    runs-on: self-hosted

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify baked runner tools
        run: |
          node --version
          npm --version

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install npm dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
        env:
          CI: false

  ai-service-tests:
    name: AI Service - Import Check
    runs-on: self-hosted

    defaults:
      run:
        working-directory: ai-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify baked runner tools
        run: |
          python --version
          pip --version

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('ai-service/requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install dependencies in virtualenv
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          grep -v '^torch' requirements.txt | pip install -r /dev/stdin
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Check syntax
        run: |
          source .venv/bin/activate
          python -m py_compile app/main.py
          find app -name "*.py" -exec python -m py_compile {} \;

      - name: Verify FastAPI app can be imported
        run: |
          source .venv/bin/activate
          python -c "import sys; sys.path.insert(0, '.'); from app.main import app; print('FastAPI app loaded OK')"
        env:
          DATABASE_URL: postgresql://postgres:admin@127.0.0.1:5432/tactic_db
