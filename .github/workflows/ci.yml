name: TacTic CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

# Cancel in-progress runs for the same branch when a new push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # JOB 1 – Laravel Backend (PHPUnit)
  # ──────────────────────────────────────────────
  backend-tests:
    name: Backend – PHPUnit
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo, pdo_sqlite, sqlite3, mbstring, xml, bcmath, tokenizer
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy .env for testing
        run: cp .env.example .env || echo "APP_KEY=" > .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Run PHPUnit (SQLite in-memory)
        run: php artisan test --env=testing

  # ──────────────────────────────────────────────
  # JOB 2 – React Frontend (TypeScript + Build)
  # ──────────────────────────────────────────────
  frontend-tests:
    name: Frontend – TypeScript & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Run React tests
        run: npm test -- --watchAll=false --passWithNoTests
        env:
          CI: true

      - name: Production build
        run: npm run build
        env:
          CI: false   # Treat warnings as warnings, not errors

  # ──────────────────────────────────────────────
  # JOB 3 – Python AI Service (FastAPI + imports)
  # ──────────────────────────────────────────────
  ai-service-tests:
    name: AI Service – Lint & Import check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies (CPU-only torch for CI speed)
        run: |
          pip install --upgrade pip
          # Install torch CPU-only wheel first to avoid downloading the huge CUDA build
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # Install the rest of the project requirements
          pip install -r requirements.txt --no-deps --ignore-installed torch

      - name: Check syntax (py_compile)
        run: |
          python -m py_compile app/main.py
          find app -name "*.py" -exec python -m py_compile {} \;

      - name: Verify FastAPI app can be imported
        run: |
          python -c "import sys; sys.path.insert(0, '.'); from app.main import app; print('FastAPI app loaded OK')"
        env:
          DATABASE_URL: "postgresql://postgres:admin@127.0.0.1:5433/tactic_db"
