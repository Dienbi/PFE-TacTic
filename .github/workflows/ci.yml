name: TacTic CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

# Cancel in-progress runs for the same branch when a new push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # JOB 1 – Laravel Backend (PHPUnit)
  # ──────────────────────────────────────────────
  backend-tests:
    name: Backend – PHPUnit
    runs-on: self-hosted

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: tactic_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify PHP runtime
        run: |
          php -v
          composer --version
          php -r "exit(version_compare(PHP_VERSION, '8.2.0', '>=') ? 0 : 1);"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy .env for testing
        run: cp .env.example .env || echo "APP_KEY=" > .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Create .env.testing for PostgreSQL
        run: |
          cp .env .env.testing
          sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=pgsql/' .env.testing
          sed -i 's/DB_HOST=.*/DB_HOST=127.0.0.1/' .env.testing
          sed -i 's/DB_PORT=.*/DB_PORT=5432/' .env.testing
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=tactic_db/' .env.testing
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=postgres/' .env.testing
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=admin/' .env.testing

      - name: Run PHPUnit (PostgreSQL)
        run: php artisan test --env=testing
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: tactic_db
          DB_USERNAME: postgres
          DB_PASSWORD: admin

  # ──────────────────────────────────────────────
  # JOB 2 – React Frontend (TypeScript + Build)
  # ──────────────────────────────────────────────
  frontend-tests:
    name: Frontend – TypeScript & Build
    runs-on: self-hosted

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        run: npm install

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
        env:
          CI: false   # Treat warnings as warnings, not errors

  # ──────────────────────────────────────────────
  # JOB 3 – Python AI Service (FastAPI + imports)
  # ──────────────────────────────────────────────
  ai-service-tests:
    name: AI Service – Lint & Import check
    runs-on: self-hosted

    defaults:
      run:
        working-directory: ai-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies (CPU-only torch for CI speed)
        run: |
          pip install --upgrade pip
          # Install all requirements except torch (avoids downloading the large CUDA build)
          grep -v '^torch' requirements.txt | pip install -r /dev/stdin
          # Install CPU-only torch
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Check syntax (py_compile)
        run: |
          python -m py_compile app/main.py
          find app -name "*.py" -exec python -m py_compile {} \;

      - name: Verify FastAPI app can be imported
        run: |
          python -c "import sys; sys.path.insert(0, '.'); from app.main import app; print('FastAPI app loaded OK')"
        env:
          DATABASE_URL: "postgresql://postgres:admin@127.0.0.1:5432/tactic_db"
