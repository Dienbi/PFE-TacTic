name: Coverage

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # every day at midnight UTC

jobs:
  coverage:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: tactic_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          coverage: xdebug
          extensions: mbstring, pdo, pgsql, bcmath

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Prepare Laravel test environment
        run: |
          cp .env.example .env
          php artisan key:generate
          cp .env .env.testing

          sed -i 's/^APP_ENV=.*/APP_ENV=testing/' .env.testing || echo "APP_ENV=testing" >> .env.testing
          sed -i 's/^CACHE_DRIVER=.*/CACHE_DRIVER=array/' .env.testing || echo "CACHE_DRIVER=array" >> .env.testing
          sed -i 's/^QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' .env.testing || echo "QUEUE_CONNECTION=sync" >> .env.testing
          sed -i 's/^SESSION_DRIVER=.*/SESSION_DRIVER=array/' .env.testing || echo "SESSION_DRIVER=array" >> .env.testing
          sed -i 's/^MAIL_MAILER=.*/MAIL_MAILER=array/' .env.testing || echo "MAIL_MAILER=array" >> .env.testing
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=pgsql/' .env.testing || echo "DB_CONNECTION=pgsql" >> .env.testing
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env.testing || echo "DB_HOST=127.0.0.1" >> .env.testing
          sed -i 's/^DB_PORT=.*/DB_PORT=5432/' .env.testing || echo "DB_PORT=5432" >> .env.testing
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=tactic_db/' .env.testing || echo "DB_DATABASE=tactic_db" >> .env.testing
          sed -i 's/^DB_USERNAME=.*/DB_USERNAME=postgres/' .env.testing || echo "DB_USERNAME=postgres" >> .env.testing
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=admin/' .env.testing || echo "DB_PASSWORD=admin" >> .env.testing

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            pg_isready -h 127.0.0.1 -p 5432 -U postgres && exit 0
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          exit 1

      - name: Run migrations
        run: php artisan migrate --env=testing --force
        env:
          APP_ENV: testing
          CACHE_DRIVER: array
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: tactic_db
          DB_USERNAME: postgres
          DB_PASSWORD: admin

      - name: Run tests with coverage
        run: |
          php artisan test --env=testing \
            --coverage-clover=coverage.xml \
            --coverage-html=coverage-report
        env:
          APP_ENV: testing
          CACHE_DRIVER: array
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: tactic_db
          DB_USERNAME: postgres
          DB_PASSWORD: admin

      - name: Upload Clover report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: backend/coverage.xml

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: backend/coverage-report
