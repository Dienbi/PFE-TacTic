name: Weekend Maintenance Audit

on:
  schedule:
    # Sunday at 02:00 (matches the Python AI scheduler)
    - cron: '0 2 * * 0'
  workflow_dispatch: # Run manually from the Actions tab to test

jobs:
  audit-and-pr:
    name: Run Audit and Create PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ──────────────────────────────────────────────
      # Environment Setup
      # ──────────────────────────────────────────────
      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo, pdo_pgsql, mbstring, xml, bcmath, tokenizer
          coverage: none

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"
          cache-dependency-path: ai-service/requirements.txt

      # ──────────────────────────────────────────────
      # Backend – PHP CS Fixer
      # ──────────────────────────────────────────────
      - name: Fix – PHP-CS-Fixer (Backend)
        continue-on-error: true
        run: |
          curl -sL https://github.com/PHP-CS-Fixer/PHP-CS-Fixer/releases/latest/download/php-cs-fixer.phar -o php-cs-fixer.phar
          php php-cs-fixer.phar fix backend/app/ --rules=@PSR12 --allow-risky=yes
          rm -f php-cs-fixer.phar .php-cs-fixer.cache

      # ──────────────────────────────────────────────
      # AI Service – Ruff
      # ──────────────────────────────────────────────
      - name: Fix – Ruff (AI Service)
        continue-on-error: true
        run: |
          pip install ruff --quiet
          ruff check ai-service/app/ --fix || true

      # ──────────────────────────────────────────────
      # Frontend – ESLint
      # ──────────────────────────────────────────────
      - name: Fix – ESLint (Frontend)
        continue-on-error: true
        run: |
          cd frontend
          npm install --legacy-peer-deps --silent
          npx eslint src/ --ext .ts,.tsx --fix || true
          git checkout -- package-lock.json || true

      # ──────────────────────────────────────────────
      # Open a PR if any files were changed
      # ──────────────────────────────────────────────
      - name: Create Pull Request if changes exist
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: weekend automated code style & lint fixes"
          branch: chore/weekend-maintenance
          delete-branch: true
          title: "🔧 Weekend Maintenance – Auto-fix $(date +'%Y-%m-%d')"
          body: |
            Automated fixes applied by the Weekend Maintenance Audit workflow.

            **What was checked:**
            - Backend: PHP-CS-Fixer (PSR-12)
            - Frontend: ESLint auto-fix on `src/`
            - AI Service: Ruff auto-fix

            Review the diff and merge if the fixes look correct.
          labels: maintenance, automated
