name: TacTic Professional CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: 'Run CI/tests only (skip build, push, and deploy)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  # =========================
  # STAGE 1-3: LINT + SECURITY
  # =========================
  initial-checks:
    name: Lint, Static Analysis & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql
          tools: composer:v2

      - name: Backend - Install Dependencies
        run: composer install --no-interaction --prefer-dist
        working-directory: backend

      - name: Backend - Linting (Pint)
        run: ./vendor/bin/pint --test
        working-directory: backend

      - name: Backend - Static Analysis (PHPStan)
        run: ./vendor/bin/phpstan analyse
        working-directory: backend

      - name: Backend - Security (Composer Audit)
        run: composer audit
        working-directory: backend

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend - Install Dependencies
        run: npm ci
        working-directory: frontend

      - name: Frontend - Linting (ESLint)
        run: npm run lint || echo "Linting failed but continuing"
        working-directory: frontend

      - name: Frontend - Type Check
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Frontend - Security Audit
        run: npm audit --audit-level=high
        working-directory: frontend

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: AI Service Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy pip-audit
          pip install -r requirements.txt
        working-directory: ai-service

      - name: AI Lint
        run: |
          ruff check .
          black --check .
        working-directory: ai-service

      - name: AI Type Check
        run: mypy .
        working-directory: ai-service

      - name: AI Security
        run: pip-audit
        working-directory: ai-service

      - name: Secrets Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # =========================
  # UNIT TESTS
  # =========================
  unit-tests:
    name: Unit Testing
    needs: initial-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: xdebug

      - name: Backend Tests
        run: |
          cd backend
          composer install
          php artisan test --testsuite=Unit --coverage-clover coverage.xml
        env:
          APP_KEY: ${{ secrets.APP_KEY }}

      - name: AI Tests
        run: |
          cd ai-service
          pip install pytest pytest-cov
          pip install -r requirements.txt
          pytest tests/ --cov=app --cov-report=xml

      - name: Frontend Tests
        run: |
          cd frontend
          npm ci
          npm test -- --watchAll=false --coverage

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            backend/coverage.xml
            ai-service/coverage.xml
            frontend/coverage/


  # =========================
  # SONAR
  # =========================
  sonar-analysis:
    name: SonarQube Analysis
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: coverage-reports

      - name: Sonar Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}


  # =========================
  # INTEGRATION + E2E
  # =========================
  integration-and-e2e:
    name: Integration + E2E
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start Services
        run: docker compose -f docker/docker-compose.dev.yml up -d

      - name: Run Migrations
        run: docker exec tactic-backend php artisan migrate --force

      - name: Integration Tests
        run: docker exec tactic-backend php artisan test --testsuite=Feature

      - name: API Contract Tests
        run: |
          pip install pytest requests
          API_BASE_URL=http://localhost:8000/api \
          AI_BASE_URL=http://localhost:8001 \
          pytest api_contract_tests/

      - name: E2E Tests
        run: |
          cd frontend
          npm ci
          npx playwright install --with-deps chromium
          STAGING_BASE_URL=http://localhost:3000 npx playwright test

      - name: Stop Services
        if: always()
        run: docker compose -f docker/docker-compose.dev.yml down


  # =========================
  # BUILD + SCAN + PUSH
  # =========================
  build-and-push:
    name: Build, Scan & Push Images
    needs: [sonar-analysis, integration-and-e2e]

    if: >
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.skip_deploy != 'true'))
      &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.NEXUS_URL }}
          username: ${{ secrets.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      # Backend
      - name: Build Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/backend/Dockerfile
          push: false
          load: true
          tags: tactic-backend:latest

      - name: Scan Backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: tactic-backend:latest
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH

      - name: Push Backend
        run: |
          docker tag tactic-backend:latest ${{ secrets.NEXUS_URL }}/docker-hosted/tactic-backend:${{ github.sha }}
          docker push ${{ secrets.NEXUS_URL }}/docker-hosted/tactic-backend:${{ github.sha }}

      # Frontend
      - name: Build Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/frontend/Dockerfile
          push: false
          load: true
          tags: tactic-frontend:latest

      - name: Scan Frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: tactic-frontend:latest
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH

      - name: Push Frontend
        run: |
          docker tag tactic-frontend:latest ${{ secrets.NEXUS_URL }}/docker-hosted/tactic-frontend:${{ github.sha }}
          docker push ${{ secrets.NEXUS_URL }}/docker-hosted/tactic-frontend:${{ github.sha }}

      # AI
      - name: Build AI
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/ai-service/Dockerfile
          push: false
          load: true
          tags: tactic-ai-service:latest

      - name: Scan AI
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: tactic-ai-service:latest
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH

      - name: Push AI
        run: |
          docker tag tactic-ai-service:latest ${{ secrets.NEXUS_URL }}/docker-hosted/tactic-ai-service:${{ github.sha }}
          docker push ${{ secrets.NEXUS_URL }}/docker-hosted/tactic-ai-service:${{ github.sha }}