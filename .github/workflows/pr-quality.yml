name: PR Quality Gate

on:
  pull_request:
    branches: ["main", "develop"]

concurrency:
  group: pr-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend Tests + Static Analysis
    runs-on: self-hosted
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: tactic_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install setup-php requirements
        run: sudo apt-get update && sudo apt-get install -y software-properties-common curl jq unzip iproute2
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo, pdo_pgsql, mbstring, xml, bcmath, tokenizer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare env for tests
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run PHPUnit
        run: php artisan test --env=testing
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: tactic_db
          DB_USERNAME: postgres
          DB_PASSWORD: admin

      - name: Run Larastan/PHPStan
        run: vendor/bin/phpstan analyse app --memory-limit=1G

      - name: Run Pint in test mode
        run: ./vendor/bin/pint --test

  frontend-quality:
    name: Frontend Lint + Typecheck + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npx eslint "src/**/*.{ts,tsx,js,jsx}"

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  ai-quality:
    name: AI Lint + Static Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Ruff lint
        run: ruff check app

      - name: Syntax check
        run: |
          python -m py_compile app/main.py
          find app -name "*.py" -exec python -m py_compile {} \;

      - name: FastAPI import smoke test
        run: python -c "import sys; sys.path.insert(0, '.'); from app.main import app; print('FastAPI app loaded OK')"
        env:
          DATABASE_URL: postgresql://postgres:admin@127.0.0.1:5432/tactic_db

  sonarqube:
    name: SonarQube Scan + Quality Gate
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend-quality, ai-quality]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@master
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
