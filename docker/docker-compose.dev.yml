name: tactic-dev

services:
  postgres:
    image: postgres:15
    container_name: tactic-postgres
    environment:
      POSTGRES_DB: tactic_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tactic_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tactic

  ai-service:
    build:
      context: ..
      dockerfile: docker/ai-service/Dockerfile
    container_name: tactic-ai-service
    environment:
      DATABASE_URL: postgresql://postgres:admin@postgres:5432/tactic_db
      ENABLE_SCHEDULER: "false"
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - tactic

  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    container_name: tactic-backend
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: tactic_db
      DB_USERNAME: postgres
      DB_PASSWORD: admin
      CACHE_DRIVER: file
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: file
      AI_SERVICE_URL: http://ai-service:8001
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit((int)!@file_get_contents('http://127.0.0.1:8000/api/health'));" ]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - tactic

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
      args:
        REACT_APP_API_URL: http://127.0.0.1:8000/api
    container_name: tactic-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - tactic

networks:
  tactic:
    driver: bridge

volumes:
  postgres_data:
