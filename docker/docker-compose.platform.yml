name: tactic-platform

# GitHub Actions self-hosted runners (4x) — need GITHUB_RUNNER_TOKEN in docker/.env.runners
include:
  - path: docker-compose.runners.yml

services:
  sonar-db:
    image: postgres:15
    container_name: tactic-sonar-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonarqube
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    networks:
      - platform

  sonarqube:
    image: sonarqube:10.8-community
    container_name: tactic-sonarqube
    depends_on:
      - sonar-db
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
      SONAR_WEB_HOST: 0.0.0.0
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    networks:
      platform:
        aliases:
          - sonarqube

  nexus:
    image: sonatype/nexus3:latest
    container_name: tactic-nexus
    ports:
      - "8081:8081"
      - "8082:8082"
    volumes:
      - nexus_data:/nexus-data
    networks:
      - platform

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: tactic-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - platform

  grafana:
    image: grafana/grafana:11.2.0
    container_name: tactic-grafana
    depends_on:
      - prometheus
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - platform

networks:
  platform:
    driver: bridge

volumes:
  sonar_db_data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  nexus_data:
  prometheus_data:
  grafana_data:
  github_runner_1_data:
  github_runner_2_data:
  github_runner_3_data:
  github_runner_4_data:
