x-runner-image: &runner-image
  image: tactic-github-runner:ci
  build:
    context: ../actions-runner
    dockerfile: Dockerfile
  extra_hosts:
    - "host.docker.internal:host-gateway"
  env_file:
    - path: .env.runners
      required: true

x-runner-env: &runner-env
  REPO_URL: ${GITHUB_RUNNER_REPO_URL:?Set GITHUB_RUNNER_REPO_URL in docker/.env.runners}
  RUNNER_TOKEN: ${GITHUB_RUNNER_TOKEN:?Set a fresh GITHUB_RUNNER_TOKEN in docker/.env.runners}
  RUNNER_SCOPE: repo
  EPHEMERAL: "false"
  DISABLE_AUTOMATIC_DEREGISTRATION: "true"
  CONFIGURED_ACTIONS_RUNNER_FILES_DIR: /runner-data
  LABELS: self-hosted,linux,x64,docker,ci

services:
  github-runner-1:
    <<: *runner-image
    container_name: tactic-github-runner-1
    restart: unless-stopped
    environment:
      <<: *runner-env
      RUNNER_NAME_PREFIX: tactic-runner-1
      RANDOM_RUNNER_SUFFIX: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - github_runner_1_data:/runner-data
    networks:
      - platform

  github-runner-2:
    <<: *runner-image
