global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: backend
    metrics_path: /api/health
    static_configs:
      - targets: ["host.docker.internal:8000"]

  - job_name: ai-service
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8001"]
