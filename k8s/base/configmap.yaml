apiVersion: v1
kind: ConfigMap
metadata:
  name: tactic-config
  namespace: tactic-dev
data:
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: http://backend.tactic-dev.svc.cluster.local
  FRONTEND_URL: http://frontend.tactic-dev.svc.cluster.local
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_DATABASE: tactic_db
  DB_USERNAME: postgres
  AI_SERVICE_URL: http://ai-service.tactic-dev.svc.cluster.local:8001
  CORS_ALLOWED_ORIGINS: http://localhost:3000
  DATABASE_URL: postgresql://postgres:admin@postgres:5432/tactic_db
  ENABLE_SCHEDULER: "false"
