apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tactic-ingress
  namespace: tactic-dev
spec:
  rules:
    - host: tactic-dev.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
