apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: tactic-dev
spec:
  selector:
    app: backend
    version: blue # Default to blue
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: tactic-dev
spec:
  selector:
    app: frontend
    version: blue # Default to blue
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: tactic-dev
spec:
  selector:
    app: ai-service
    version: blue # Default to blue
  ports:
    - protocol: TCP
      port: 8001
      targetPort: 8001
