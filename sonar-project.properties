sonar.projectKey=tactic-monorepo
sonar.projectName=TacTic Monorepo
sonar.sourceEncoding=UTF-8

sonar.sources=backend/app,backend/routes,frontend/src,ai-service/app
sonar.tests=backend/tests

sonar.test.inclusions=backend/tests/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,ai-service/tests/**
sonar.exclusions=**/node_modules/**,**/vendor/**,**/build/**,**/dist/**,**/trained_models/**,**/*.pt,**/storage/**,**/__pycache__/**,**/.venv/**

sonar.php.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
