version: "2"
type: backend
tech_stack:
  - PHP 8.2
  - Laravel 10
  - PostgreSQL
  - JWT (php-open-source-saver/jwt-auth)
  - PHPUnit
features:
  - name: Authentication API
    description: JWT-based login, registration, token refresh, profile and password management
    files:
      - backend/app/Http/Controllers/Api/AuthController.php
      - backend/app/Services/AuthService.php
      - backend/app/Http/Requests/LoginRequest.php
      - backend/app/Http/Requests/RegisterRequest.php
      - backend/app/Http/Requests/ChangePasswordRequest.php
      - backend/routes/api.php
    endpoints:
      - method: POST
        path: /api/auth/login
        description: Login with email and password, returns access_token
        auth_required: false
        request_schema:
          body:
            email: string
            password: string
        response_schema:
          "200": "{ access_token, token_type, expires_in, user }"
          "401": Invalid credentials or inactive account
      - method: POST
        path: /api/auth/register
        description: Register a new user account
        auth_required: false
        response_schema:
          "201": "{ access_token, user }"
      - method: POST
        path: /api/auth/logout
        description: Invalidate current JWT token
        auth_required: true
        response_schema:
          "200": "{ message }"
      - method: POST
        path: /api/auth/refresh
        description: Refresh JWT token
        auth_required: true
        response_schema:
          "200": "{ access_token, token_type, expires_in }"
      - method: GET
        path: /api/auth/me
        description: Get authenticated user profile with competences
        auth_required: true
        response_schema:
          "200": "{ user }"
      - method: POST
        path: /api/auth/change-password
        description: Change password for authenticated user
        auth_required: true
        request_schema:
          body:
            current_password: string
            new_password: string
        response_schema:
          "200": "{ message }"
          "400": Wrong current password
      - method: PUT
        path: /api/auth/update-profile
        description: Update authenticated user profile fields
        auth_required: true
        response_schema:
          "200": "{ message, user }"
      - method: PUT
        path: /api/auth/update-skills
        description: Sync user competences/skills list
        auth_required: true
        response_schema:
          "200": "{ message, user }"
    depends_on: []

  - name: Utilisateur API
    description: Employee/user CRUD, search, archive/restore, status and team assignment (RH-only mutations)
    files:
      - backend/app/Http/Controllers/Api/UtilisateurController.php
      - backend/app/Services/UtilisateurService.php
      - backend/app/Repositories/UtilisateurRepository.php
      - backend/app/Http/Requests/UtilisateurRequest.php
      - backend/routes/api.php
    endpoints:
      - method: GET
        path: /api/utilisateurs
        description: List users (paginated or all with ?all=true)
        auth_required: true
        response_schema:
          "200": Paginated users or array
      - method: GET
        path: /api/utilisateurs/search
        description: Search users by query string q
        auth_required: true
        response_schema:
          "200": User[]
      - method: GET
        path: /api/utilisateurs/disponibles
        description: List available employees
        auth_required: true
        response_schema:
          "200": User[]
      - method: GET
        path: /api/utilisateurs/role/{role}
        description: Filter users by role (rh, chef_equipe, employe)
        auth_required: true
        response_schema:
          "200": User[]
      - method: GET
        path: /api/utilisateurs/{id}
        description: Get single user by ID
        auth_required: true
        response_schema:
          "200": User
          "404": Not found
      - method: POST
        path: /api/utilisateurs
        description: Create user (RH only)
        auth_required: true
        response_schema:
          "201": User
          "403": Forbidden for non-RH
      - method: PUT
        path: /api/utilisateurs/{id}
        description: Update user (RH only)
        auth_required: true
        response_schema:
          "200": "{ message }"
          "403": Forbidden
      - method: DELETE
        path: /api/utilisateurs/{id}
        description: Soft-delete/archive user (RH only)
        auth_required: true
        response_schema:
          "200": "{ message }"
      - method: GET
        path: /api/utilisateurs/archived
        description: List archived users (RH only)
        auth_required: true
        response_schema:
          "200": User[]
      - method: POST
        path: /api/utilisateurs/{id}/restore
        description: Restore archived user (RH only)
        auth_required: true
        response_schema:
          "200": "{ message }"
          "404": Not found
      - method: POST
        path: /api/utilisateurs/{id}/activate
        description: Activate deactivated user (RH only)
        auth_required: true
        response_schema:
          "200": "{ message }"
      - method: PUT
        path: /api/utilisateurs/{id}/status
        description: Update employee status enum (RH only)
        auth_required: true
        response_schema:
          "200": "{ message }"
      - method: PUT
        path: /api/utilisateurs/{id}/equipe
        description: Assign user to team (RH only)
        auth_required: true
        response_schema:
          "200": "{ message }"
      - method: PUT
        path: /api/utilisateurs/{id}/competences
        description: Update user competences (RH only)
        auth_required: true
        response_schema:
          "200": "{ message }"
    depends_on:
      - Authentication API

  - name: Pointage API
    description: Attendance clock-in/out, personal history, RH/manager summary and absence management
    files:
      - backend/app/Http/Controllers/Api/PointageController.php
      - backend/app/Services/PointageService.php
      - backend/app/Repositories/PointageRepository.php
      - backend/routes/api.php
    endpoints:
      - method: GET
        path: /api/pointages/today
        description: Get today's attendance record for current user
        auth_required: true
        response_schema:
          "200": Pointage or null
      - method: GET
        path: /api/pointages/mes-pointages
        description: Paginated personal attendance history
        auth_required: true
        response_schema:
          "200": Paginated Pointage[]
      - method: POST
        path: /api/pointages/entree
        description: Clock in for today
        auth_required: true
        response_schema:
          "200": "{ message, pointage }"
      - method: POST
        path: /api/pointages/sortie
        description: Clock out for today
        auth_required: true
        response_schema:
          "200": "{ message, pointage }"
      - method: GET
        path: /api/pointages/stats
        description: Personal attendance statistics
        auth_required: true
        response_schema:
          "200": Stats object
      - method: GET
        path: /api/pointages/summary
        description: Daily attendance summary (RH/chef_equipe only)
        auth_required: true
        response_schema:
          "200": "{ date, stats, lists }"
          "403": Forbidden for employe
      - method: GET
        path: /api/pointages/date
        description: Attendance by date (RH/chef_equipe)
        auth_required: true
        response_schema:
          "200": Pointage[]
      - method: POST
        path: /api/pointages/absence
        description: Mark absence for employee (RH/chef_equipe)
        auth_required: true
        response_schema:
          "201": Pointage
      - method: POST
        path: /api/pointages/{id}/justifier
        description: Justify an absence (RH/chef_equipe)
        auth_required: true
        response_schema:
          "200": "{ message }"
    depends_on:
      - Authentication API

  - name: Conge API
    description: Leave request submission, approval workflow, balance deduction, team pending views
    files:
      - backend/app/Http/Controllers/Api/CongeController.php
      - backend/app/Services/CongeService.php
      - backend/app/Repositories/CongeRepository.php
      - backend/app/Services/LeaveConflictService.php
      - backend/routes/api.php
    endpoints:
      - method: GET
        path: /api/conges/mes-conges
        description: Paginated personal leave requests
        auth_required: true
        response_schema:
          "200": Paginated Conge[]
      - method: POST
        path: /api/conges
        description: Submit leave request
        auth_required: true
        request_schema:
          body:
            type: string
            date_debut: date
            date_fin: date
            motif: string
        response_schema:
          "201": Conge
          "422": Validation error
      - method: DELETE
        path: /api/conges/{id}/annuler
        description: Cancel own pending leave request
        auth_required: true
        response_schema:
          "200": "{ message }"
      - method: GET
        path: /api/conges
        description: List all leaves (RH/chef_equipe)
        auth_required: true
        response_schema:
          "200": Conge[]
      - method: GET
        path: /api/conges/en-attente
        description: Pending leave requests (RH/chef_equipe)
        auth_required: true
        response_schema:
          "200": Conge[]
      - method: POST
        path: /api/conges/{id}/approuver
        description: Approve leave (RH/chef_equipe), deducts solde_conge
        auth_required: true
        response_schema:
          "200": "{ message }"
          "403": Forbidden for employe
      - method: POST
        path: /api/conges/{id}/refuser
        description: Reject leave (RH/chef_equipe)
        auth_required: true
        response_schema:
          "200": "{ message }"
      - method: GET
        path: /api/conges/{id}
        description: Show single leave request
        auth_required: true
        response_schema:
          "200": Conge
    depends_on:
      - Authentication API

  - name: Paie API
    description: Payroll simulation, generation, validation, payment marking, payslip download
    files:
      - backend/app/Http/Controllers/Api/PaieController.php
      - backend/app/Services/PaieService.php
      - backend/app/Services/PayrollCalculator.php
      - backend/app/Repositories/PaieRepository.php
      - backend/routes/api.php
    endpoints:
      - method: GET
        path: /api/paies/mes-paies
        description: Employee's own payslips
        auth_required: true
        response_schema:
          "200": Paginated Paie[]
      - method: GET
        path: /api/paies/stats
        description: Personal payroll stats
        auth_required: true
        response_schema:
          "200": Stats object
      - method: GET
        path: /api/paies/{id}/download
        description: Download payslip PDF (owner or RH)
        auth_required: true
        response_schema:
          "200": PDF file
          "403": Forbidden
      - method: POST
        path: /api/paies/simuler
        description: Simulate payroll calculation (RH only)
        auth_required: true
        request_schema:
          body:
            salaire_base: number
            heures_supp: number
        response_schema:
          "200": "{ salaire_brut, salaire_net, cnss_employe, impot_mensuel }"
      - method: POST
        path: /api/paies/generer
        description: Generate payslip for employee (RH only)
        auth_required: true
        request_schema:
          body:
            utilisateur_id: integer
            periode_debut: date
            periode_fin: date
        response_schema:
          "201": Paie
          "403": Forbidden
          "422": Validation error
      - method: GET
        path: /api/paies
        description: List all payroll records (RH only)
        auth_required: true
        response_schema:
          "200": Paginated Paie[]
      - method: POST
        path: /api/paies/{id}/valider
        description: Validate generated payslip (RH only)
        auth_required: true
        response_schema:
          "200": "{ message }"
      - method: POST
        path: /api/paies/{id}/payer
        description: Mark payslip as paid (RH only)
        auth_required: true
        response_schema:
          "200": "{ message }"
      - method: GET
        path: /api/paies/global-stats
        description: Global payroll statistics (RH only)
        auth_required: true
        response_schema:
          "200": Stats object
    depends_on:
      - Authentication API

known_limitations:
  - issue: AI routes depend on external Python service at port 8001
    location: backend/app/Services/AIService.php
    impact: AI endpoints fail when ai-service is not running
  - issue: Utilisateur index uses file cache driver (users_all key)
    location: backend/app/Http/Controllers/Api/UtilisateurController.php
    impact: Tests may need Cache::flush() when asserting fresh user lists
  - issue: duree_travail in pointages must never be null (defaults to 0)
    location: backend/database/migrations
    impact: Factory/seeder data must respect NOT NULL constraint
